[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omapreview"
version = "0.1.1"
description = "Local PDF filling and signing for Omarchy"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = ["PySide6==6.12.0", "PyMuPDF==2.1"]

[project.urls]
Repository = "https://github.com/Cause-of-a-Kind/omapreview"
Issues = "https://github.com/Cause-of-a-Kind/omapreview/issues"

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-qt==4.5.0"]

[project.scripts]
omapreview = "omapreview.__main__:main"

[tool.setuptools.packages.find]
include = ["omapreview*"]
